# Fly.io app config - https://fly.io/docs/reference/configuration/
# Deploy: flyctl launch (lần đầu) hoặc flyctl deploy

app = "data-crawl"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  process_count = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
