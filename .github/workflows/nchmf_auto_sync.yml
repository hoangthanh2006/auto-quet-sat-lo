name: NCHMF 24/7 Auto Sync

on:
  schedule:
    # Chạy tự động 2 lần mỗi giờ (ở phút thứ 15 và 45)
    # Lệch phút 00 để tránh tắc nghẽn hàng đợi cron của GitHub Actions
    - cron: '15,45 * * * *'
  workflow_dispatch: # Bấm nút "Run workflow" thủ công trên GitHub UI bất cứ lúc nào
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nchmf_auto_sync.yml'
      - 'server/autoSyncNCHMF.js'
      - 'server/luquetSatloService.js'
      - 'server/environmentalService.js'

permissions:
  contents: read

concurrency:
  group: nchmf-247-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Crawl NCHMF & Sync Firebase RTDB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: 'Asia/Ho_Chi_Minh'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          echo "📦 Cài đặt thư viện backend..."
          npm install --prefix server --omit=dev --ignore-scripts

      - name: Run NCHMF Crawler & Sync to Supabase & Firebase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mmmnpsbnwbhracyuhhmd.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_cLtlP6FRQp0ItsyDJNdwhg_qWexo8Nm' }}
        run: |
          echo "🚀 Khởi động NCHMF 24/7 Automated Sync..."
          node server/autoSyncNCHMF.js
