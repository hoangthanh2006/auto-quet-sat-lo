name: Vrain 1H Auto Sync & Git Backup

on:
  schedule:
    # Dữ liệu Vrain (đo mưa) cập nhật theo giờ; chạy mỗi 15 phút (phút 7, 22, 37, 52)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công trên GitHub UI
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vrain_auto_sync.yml'
      - 'server/autoSyncVrain.js'
      - 'server/vrainService.js'

permissions:
  contents: write

concurrency:
  group: vrain-1h-sync
  cancel-in-progress: false

jobs:
  sync_and_backup:
    name: Crawl Vrain, Sync Firebase & Push Git
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: 'Asia/Ho_Chi_Minh'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          echo "📦 Cài đặt thư viện backend..."
          npm install --prefix server --omit=dev --ignore-scripts

      - name: Run Vrain Crawler & Sync to Supabase & Firebase
        run: |
          echo "🚀 Khởi động Vrain Auto Sync (1 giờ một lần)..."
          node server/autoSyncVrain.js 2>&1 | tee /tmp/vrain.log || {
            echo "❌ Quá trình chạy bị lỗi! Đang đẩy log để chẩn đoán..."
            mkdir -p server/data/vrain
            cp /tmp/vrain.log server/data/vrain/error.log
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add server/data/vrain/error.log
            git commit -m "ci: debug error log [skip ci]" || true
            git push origin main || true
            exit 1
          }

      - name: Commit & Push Updated Data to Git
        run: |
          echo "🔍 Kiểm tra dữ liệu thay đổi để commit lên Git..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add server/data/vrain/latest.json server/data/vrain/summary.json || true

          if git diff --staged --quiet; then
            echo "ℹ️ Không có dữ liệu mới cần commit lên Git."
          else
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
            echo "📝 Phát hiện dữ liệu mới, tiến hành commit và push..."
            git commit -m "chore(vrain): tự động cập nhật dữ liệu Vrain lúc ${TIMESTAMP} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Đã push dữ liệu Vrain mới lên Git thành công!"
          fi
